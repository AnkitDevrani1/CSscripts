<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Open this file in a browser and right-click each canvas to save as PNG.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background
  const r = s * 0.15;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#4285F4';
  ctx.fill();
  // Pin
  const cx = s / 2, cy = s * 0.42, pr = s * 0.22;
  ctx.beginPath();
  ctx.arc(cx, cy, pr, Math.PI, 0);
  ctx.lineTo(cx, s * 0.82);
  ctx.closePath();
  ctx.fillStyle = 'white';
  ctx.fill();
  // Dot
  ctx.beginPath();
  ctx.arc(cx, cy, pr * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = '#4285F4';
  ctx.fill();
}
drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
